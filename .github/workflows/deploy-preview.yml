name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages-dev branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-dev
          force_orphan: true
          commit_message: 'Deploy PR #${{ github.event.pull_request.number }} preview'

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # Pages deploy (which publishes gh-pages-dev at /dev/) explicitly.
      - name: Publish preview to /dev/
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.head_ref }}"

      # Comment once, when the PR is opened; later pushes update the preview silently.
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://rokitalab.github.io/OpenPedCanExpress/dev/`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**\n\nView this PR at: ${previewUrl}\n\n_Note: Preview updates automatically on each push to this PR._`
            });
