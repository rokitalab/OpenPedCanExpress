# Rebuilds the Parquet expression files from the OpenPedCan source data.
# Runs on any machine with Docker; see docker-README.md.
#
#   docker compose up --build
services:
  preprocessing:
    build: .
    image: openpedcanexpress-preprocessing:latest
    container_name: openpedcanexpress-build
    volumes:
      # Source data (read-only); see data/source/README.md for the file list
      - ./data/source:/app/data/source:ro
      # Output: Parquet files and manifest.json are written here
      - ./data/partitions:/app/data/partitions
