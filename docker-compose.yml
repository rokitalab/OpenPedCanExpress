version: '3.8'

services:
  preprocessing:
    build: .
    image: openpedcanexpress-preprocessing:latest
    container_name: openpedcanexpress-build

    # Allocate sufficient memory for multi-cohort processing
    # Adjust based on your EC2 instance size
    deploy:
      resources:
        limits:
          memory: 64G
        reservations:
          memory: 48G

    # Mount data directories
    volumes:
      # Source data (read-only)
      - ./data/source:/app/data/source:ro

      # Output directory (read-write)
      - ./data/partitions:/app/data/partitions

      # TAPESTRY histologies (read-only)
      # Update path to your TAPESTRY repo location
      - ../TAPESTRY-data-preprocessing:/tapestry:ro

    # Set environment variables if needed
    environment:
      - R_MAX_VSIZE=64Gb

    # Override command if you want to run a different script
    # command: Rscript scripts/03-partition-only.R
